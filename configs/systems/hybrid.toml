name = "hybrid"
description = "Full text + vector over raw chunks, fused by reciprocal rank. Hosted answer model."

[system]
kind = "retrieval"

[retrieval]
corpora = ["chunks"]
modes = ["fts", "vector"]
fusion = "rrf"
rrf_k = 60
pool = 50          # candidates per mode before fusion
k = 20             # recall@k cut-off and the most items the answer model may see

[answer]
llm = "groq-120b-answer"
context_tokens = 4500   # packed to fit 8k tokens/minute (M2)
min_top_similarity = 0.0   # abstention threshold: calibrate on dev only (F1)
